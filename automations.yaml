- id: '1769364987864'
  alias: Ems Tapdial Control
  description: Direkte Szenenwahl und Dimmen per Rad via MQTT
  triggers:
  - topic: zigbee2mqtt/ems_tapdialswitch
    trigger: mqtt
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json is defined \n   and trigger.payload_json.action
      is defined \n   and trigger.payload_json.action != None \n   and trigger.payload_json.action
      != '' }}\n"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action == ''button_1_press'' }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.ems_hell
        data:
          transition: 2
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action == ''button_2_press'' }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.ems_chillo
        data:
          transition: 2
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action == ''button_3_press'' }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.ems_chillo_plus
        data:
          transition: 2
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action == ''button_4_press'' }}'
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.ems_diskokugel
    - conditions:
      - condition: template
        value_template: '{{ ''hold'' in trigger.payload_json.action }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.ems_alle_lichter
        data:
          transition: 1
    - conditions:
      - condition: template
        value_template: '{{ ''dial_rotate'' in trigger.payload_json.action }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ ''left'' in trigger.payload_json.action and ''fast''
            in trigger.payload_json.action }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ems_lichter_nicht_dimmbar
      - if:
        - condition: template
          value_template: "{{ state_attr('light.ems_alle_lichter_entitaten', 'entity_id')\n
            \  | select('is_state', 'on')\n   | reject('eq', 'light.ems_diskokugel_spot')\n
            \  | list | count > 0 }}"
        then:
        - action: light.turn_on
          target:
            entity_id: "{{ state_attr('light.ems_alle_lichter_entitaten', 'entity_id')\n
              \  | select('is_state', 'on')\n   | reject('eq', 'light.ems_diskokugel_spot')\n
              \  | list }}"
          data:
            brightness_step_pct: '{% set direction = -1 if ''left'' in trigger.payload_json.action
              else 1 %} {% set step_size = 15 if ''fast'' in trigger.payload_json.action
              else 5 %} {{ direction * step_size }}'
            transition: 0.2
      - if:
        - condition: state
          entity_id: light.ems_diskokugel_spot
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.ems_diskokugel_spot
          data:
            brightness_step_pct: '{% set direction = -1 if ''left'' in trigger.payload_json.action
              else 1 %} {% set step_size = 15 if ''fast'' in trigger.payload_json.action
              else 5 %} {{ (direction * step_size) / 2 }}'
            transition: 0.2
  mode: queued
  max: 50
