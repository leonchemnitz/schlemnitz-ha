- id: '1771158055109'
  alias: Leon - Lichtwecker
  description: Sonnenaufgang endet zur Weckzeit. Die Uhrzeit wird in den Templates
    live aus input_datetime.leon_weckzeit gelesen.
  triggers:
  - minutes: '*'
    trigger: time_pattern
  conditions: []
  actions:
  - wait_template: '{{sensor == ''none'' or as_timestamp(states(sensor), None) !=
      None}}'
  - wait_template: '{% set current_time = as_timestamp(now()) %} {% set target_time
      = as_timestamp(states(sensor)) if sensor != ''none'' else as_timestamp(today_at(states(''input_datetime.leon_weckzeit'')))
      %} {{ 0 < target_time - current_time <= float(seconds) and states(check_entity)
      in [''unknown'', ''on'', ''home''] }}'
  - choose: []
    default: []
  - condition: template
    value_template: '{{sensor == ''none'' or as_timestamp(states(sensor), None) !=
      None}}'
  - condition: template
    value_template: '{% set current_time = as_timestamp(now()) %} {% set target_time
      = as_timestamp(states(sensor)) if sensor != ''none'' else as_timestamp(today_at(states(''input_datetime.leon_weckzeit'')))
      %} {{ 0 < target_time - current_time <= float(seconds) and states(check_entity)
      in [''unknown'', ''on'', ''home''] }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{state_attr(light_entity, ''min_mireds'') != None}}'
      sequence:
      - data:
          brightness: '{{start_brightness}}'
          color_temp: '{{start_mired}}'
        entity_id: light.leon_wecklichter
        action: light.turn_on
    default:
    - data:
        brightness: '{{start_brightness}}'
      entity_id: light.leon_wecklichter
      action: light.turn_on
  - repeat:
      while:
      - condition: template
        value_template: '{{ states(check_entity) == ''on'' }}'
      - condition: template
        value_template: '{{sensor == ''none'' or as_timestamp(states(sensor), None)
          != None}}'
      - condition: template
        value_template: '{% set current_time = as_timestamp(now()) %} {% set target_time
          = as_timestamp(states(sensor)) if sensor != ''none'' else as_timestamp(today_at(states(''input_datetime.leon_weckzeit'')))
          %} {{ 0 < target_time - current_time <= float(seconds) }}'
      sequence:
      - delay: '{{tick_time}}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ 0 < state_attr(light_entity, ''brightness'') | int(0)
              < end_brightness | int }}'
          - condition: template
            value_template: '{{ sensor == ''none'' or as_timestamp(states(sensor),
              None) != None }}'
          - condition: template
            value_template: '{% set current_time = as_timestamp(now()) %} {% set target_time
              = as_timestamp(states(sensor)) if sensor != ''none'' else as_timestamp(today_at(states(''input_datetime.leon_weckzeit'')))
              %} {{ 0 < target_time - current_time <= float(seconds) }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{state_attr(light_entity, ''min_mireds'') != None}}'
              sequence:
              - data:
                  brightness: '{% set current_time = as_timestamp(now()) %} {% set
                    target_time = as_timestamp(states(sensor)) if sensor != ''none''
                    else as_timestamp(today_at(states(''input_datetime.leon_weckzeit''))) %} {{ (float(end_brightness)
                    - (float(range_brightness) * (target_time - current_time) / float(seconds)))
                    | int(0) }}'
                  color_temp: '{% set current_time = as_timestamp(now()) %} {% set
                    target_time = as_timestamp(states(sensor)) if sensor != ''none''
                    else as_timestamp(today_at(states(''input_datetime.leon_weckzeit''))) %} {{ (float(end_mired)
                    + (float(start_mired) - float(end_mired)) * ((target_time - current_time)
                    / float(seconds))) | int(0) }}'
                entity_id: light.leon_wecklichter
                action: light.turn_on
            default:
            - data:
                brightness: '{% set current_time = as_timestamp(now()) %} {% set target_time
                  = as_timestamp(states(sensor)) if sensor != ''none'' else as_timestamp(today_at(states(''input_datetime.leon_weckzeit'')))
                  %} {{ (float(end_brightness) - (float(range_brightness) * (target_time
                  - current_time) / float(seconds))) | int(0) }}'
              entity_id: light.leon_wecklichter
              action: light.turn_on
  - choose: []
    default: []
  mode: single
  max_exceeded: silent
  variables:
    light_entity: light.leon_wecklichter
    sensor: none
    sunrise_duration: 25
    start_brightness: 1
    end_brightness: 254
    range_brightness: '{{float(end_brightness)-float(start_brightness)}}'
    seconds: '{{float(sunrise_duration) * 60}}'
    min_mired: 0
    start_mired: '{{state_attr(light_entity, ''max_mireds'')}}'
    end_mired: '{{[state_attr(light_entity, ''min_mireds'')|int(0), min_mired|int(0)]|max}}'
    tick_time: '{{float(seconds) / float(range_brightness)}}'
    check_entity: input_boolean.leon_wecker_aktiv
