- id: '1770107769590'
  alias: Leon - TRV follower
  description: Sendet die Raumtemperatur an den externen Eingang des TRV. Alle 30 Minuten
    auch ohne neue Messung, sonst nutzt das Ventil nach zwei Stunden wieder den eigenen
    Fühler.
  triggers:
  - entity_id: sensor.leon_temperatur
    for:
      hours: 0
      minutes: 0
      seconds: 1
    trigger: state
  - trigger: time_pattern
    minutes: /30
  - trigger: state
    entity_id: select.leon_thermostat_temperature_sensor_select
    to:
    - remote_source_offline
    - local_temperature
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.leon_temperatur'') | is_number }}'
  actions:
  - variables:
      raum: '{{ states(''sensor.leon_temperatur'') | float | round(1) }}'
  # Dieselbe Zahl schickt Zigbee2MQTT nicht erneut. Ohne neue Meldung fällt das
  # Ventil nach zwei Stunden auf den Gehäusefühler zurück.
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (states(''number.leon_thermostat_external_temperature_input'')
          | float(-99)) | round(1) == raum | float }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.leon_thermostat_external_temperature_input
        data:
          value: '{{ (raum | float + 0.1) | round(1) }}'
      - delay:
          seconds: 2
  - action: number.set_value
    target:
      entity_id: number.leon_thermostat_external_temperature_input
    data:
      value: '{{ raum }}'
  - condition: template
    value_template: '{{ states(''select.leon_thermostat_temperature_sensor_select'')
      != ''remote_temperature'' }}'
  - action: select.select_option
    target:
      entity_id: select.leon_thermostat_temperature_sensor_select
    data:
      option: remote_temperature
  mode: single
- id: leon_heizung
  alias: Leon - Heizung
  description: Fenster auf schaltet das Ventil aus, Fenster zu wieder auf Heizen, wenn
    das Fenster es ausgeschaltet hat. Hält das Ventil-Soll und sensor.leon_heizung_soll
    gleich, in beide Richtungen.
  triggers:
  - trigger: state
    entity_id: binary_sensor.leon_fenstersensor_contact
    to: 'on'
    id: fenster_auf
  - trigger: state
    entity_id: binary_sensor.leon_fenstersensor_contact
    from: 'on'
    to: 'off'
    id: fenster_zu
  - trigger: state
    entity_id: sensor.leon_heizung_soll
    id: soll_zum_ventil
  - trigger: state
    entity_id: climate.leon_thermostat
    to: heat
    id: soll_zum_ventil
  # Nach dem Einschalten meldet das Ventil kurz 7°, bis das Soll angekommen ist.
  # Erst ein Wert, der 10 Sekunden steht, gilt als Eingabe an Ventil oder Karte.
  - trigger: state
    entity_id: climate.leon_thermostat
    attribute: temperature
    for:
      seconds: 10
    id: ventil_zum_soll
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: fenster_auf
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.leon_thermostat
          state: 'off'
      sequence:
      - event: leon_heizung
        event_data:
          fenster_aus: true
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.leon_thermostat
        data:
          hvac_mode: 'off'
    - conditions:
      - condition: trigger
        id: fenster_zu
      - condition: state
        entity_id: sensor.leon_heizung_soll
        attribute: fenster_aus
        state: true
      sequence:
      - event: leon_heizung
        event_data:
          fenster_aus: false
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.leon_thermostat
        data:
          hvac_mode: heat
    - conditions:
      - condition: trigger
        id: soll_zum_ventil
      - condition: state
        entity_id: climate.leon_thermostat
        state: heat
      - condition: template
        value_template: '{{ states(''sensor.leon_heizung_soll'') | is_number and states(''sensor.leon_heizung_soll'')
          | float != state_attr(''climate.leon_thermostat'', ''temperature'') | float(0)
          }}'
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.leon_thermostat
        data:
          temperature: '{{ states(''sensor.leon_heizung_soll'') | float }}'
    - conditions:
      - condition: trigger
        id: ventil_zum_soll
      - condition: state
        entity_id: climate.leon_thermostat
        state: heat
      - condition: template
        value_template: '{{ trigger.to_state.attributes.temperature is number and trigger.to_state.attributes.temperature
          != states(''sensor.leon_heizung_soll'') | float(0) }}'
      sequence:
      - event: leon_heizung
        event_data:
          soll: '{{ trigger.to_state.attributes.temperature }}'
  mode: queued
  max: 10
