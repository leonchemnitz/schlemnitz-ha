- id: '1768751554915'
  alias: Flur Licht Synchronisation
  description: Follower-Gruppe folgt der Philips-Gruppe
  triggers:
  - entity_id: light.flur_lichter
    to:
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.flur_lichter
        state: 'on'
      sequence:
      - target:
          entity_id: light.flur_alle_lichter
        action: light.turn_on
    - conditions:
      - condition: state
        entity_id: light.flur_lichter
        state: 'off'
      sequence:
      - target:
          entity_id: light.flur_alle_lichter
        action: light.turn_off
  mode: restart
- id: '1768753634510'
  alias: Tageszeit Modus setzen
  description: Morgen (Elevation > -6°), Tag (Sunrise +1h), Abend (Sunset), Nacht
    (22:30)
  triggers:
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: -6
    id: Morgen
  - trigger: sun
    event: sunrise
    offset: 01:00:00
    id: Tag
  - trigger: sun
    event: sunset
    id: Abend
  - trigger: time
    at: '22:30:00'
    id: Nacht
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Morgen
      - condition: state
        entity_id: sun.sun
        attribute: rising
        state: false
      sequence:
      - stop: 'Abbruch: Elevation -6 Grad beim Untergang (Abenddämmerung) ignoriert.'
  - action: input_select.select_option
    target:
      entity_id: input_select.tageszeit_modus
    data:
      option: '{{ trigger.id }}'
  mode: restart
- id: '1768753724330'
  alias: Flur - Szenen Manager
  description: Wendet Szenen an beim Einschalten oder Zeitwechsel
  triggers:
  - entity_id: light.flur_alle_lichter
    from: 'off'
    to: 'on'
    trigger: state
  - entity_id: input_select.tageszeit_modus
    to:
    trigger: state
  conditions:
  - condition: state
    entity_id: light.flur_alle_lichter
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.tageszeit_modus
        state: Morgen
      sequence:
      - target:
          entity_id: scene.flur_chillo
        data:
          transition: 10
        action: scene.turn_on
    - conditions:
      - condition: state
        entity_id: input_select.tageszeit_modus
        state: Tag
      sequence:
      - target:
          entity_id: scene.flur_hell
        data:
          transition: 10
        action: scene.turn_on
    - conditions:
      - condition: state
        entity_id: input_select.tageszeit_modus
        state: Abend
      sequence:
      - target:
          entity_id: scene.flur_chillo
        data:
          transition: 10
        action: scene.turn_on
    - conditions:
      - condition: state
        entity_id: input_select.tageszeit_modus
        state: Nacht
      sequence:
      - target:
          entity_id: scene.flur_ciao
        data:
          transition: 10
        action: scene.turn_on
  mode: restart
- id: '1768759148324'
  alias: Neue Automation
  description: Follower-Gruppe folgt der Philips-Gruppe
