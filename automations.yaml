- id: bad_waesche_trocknen
  alias: Bad - Wäsche trocknen
  description: Über 70 % Feuchte heizt das Bad auf 25°. Fällt die absolute Feuchte unter
    11 g/m³ (60 % bei 21°), gilt wieder der Wert des Zeitplans, ohne Zeitplanwert 21°.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.bad_sensor_env_humidity
    above: 70
    id: feucht
  - trigger: numeric_state
    entity_id: sensor.bad_absolute_feuchte
    above: 11
    id: feucht
  - trigger: numeric_state
    entity_id: sensor.bad_absolute_feuchte
    below: 11
    id: trocken
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: feucht
      - condition: numeric_state
        entity_id: sensor.bad_sensor_env_humidity
        above: 70
      - condition: numeric_state
        entity_id: sensor.bad_absolute_feuchte
        above: 11
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.bad_heizung_soll
          attribute: trocknen
          state: true
      sequence:
      - event: bad_heizung
        event_data:
          trocknen: true
          soll: 25
    - conditions:
      - condition: trigger
        id: trocken
      - condition: state
        entity_id: sensor.bad_heizung_soll
        attribute: trocknen
        state: true
      sequence:
      - event: bad_heizung
        event_data:
          trocknen: false
          soll: '{{ state_attr(''sensor.bad_heizung_soll'', ''zeitplan_soll'') | float(21) }}'
  mode: queued
