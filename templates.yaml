# Ems wall mold risk.
# T_raum and RH_raum are the air purifier, not the wall sensor.
# T_wand is sensor.ems_sensor_wand_temperature only (its humidity is ignored).
#
# E(T) = 6.112 * exp((17.67 * T) / (T + 243.5))
# e = E(T_raum) * (RH_raum / 100)
# RH_wand = (e / E(T_wand)) * 100
#
# Templates expose Euler's number as `e`, so exp(x) is written `e ** x`.
# RH_wand: Sicher < 70, Erhöht 70–79.9, Kritisch >= 80.

- sensor:
    - unique_id: ems_rh_wand
      default_entity_id: sensor.ems_rh_wand
      name: Ems Wandfeuchte
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      icon: mdi:water-percent
      availability: >
        {{ states('sensor.zhimi_mb5_c00e_temperature') | is_number
           and states('sensor.zhimi_mb5_c00e_relative_humidity') | is_number
           and states('sensor.ems_sensor_wand_temperature') | is_number }}
      state: >
        {% set t_raum = states('sensor.zhimi_mb5_c00e_temperature') | float %}
        {% set rh_raum = states('sensor.zhimi_mb5_c00e_relative_humidity') | float %}
        {% set t_wand = states('sensor.ems_sensor_wand_temperature') | float %}
        {% set e_raum = 6.112 * e ** ((17.67 * t_raum) / (t_raum + 243.5)) %}
        {% set vapor = e_raum * (rh_raum / 100) %}
        {% set e_wand = 6.112 * e ** ((17.67 * t_wand) / (t_wand + 243.5)) %}
        {{ ((vapor / e_wand) * 100) | round(1) }}

    - unique_id: ems_rh_wand_kategorie
      default_entity_id: sensor.ems_rh_wand_kategorie
      name: Ems Wand Schimmelrisiko
      icon: mdi:shield-check
      availability: "{{ states('sensor.ems_rh_wand') | is_number }}"
      state: >
        {% set rh = states('sensor.ems_rh_wand') | float %}
        {% if rh < 70 %}Sicher{% elif rh < 80 %}Erhöht{% else %}Kritisch{% endif %}

# Leon Heizung: Raum-Soll und ob das Fenster das Ventil ausgeschaltet hat.
# Gesetzt nur über das Event leon_heizung (Skript leon_heizung_soll und
# Automation "Leon - Heizung"). Bleibt über Neustarts erhalten.
- triggers:
    - trigger: event
      event_type: leon_heizung
  sensor:
    - unique_id: leon_heizung_soll
      default_entity_id: sensor.leon_heizung_soll
      name: Leon Heizung Soll
      unit_of_measurement: "°C"
      device_class: temperature
      icon: mdi:thermostat
      state: >
        {% set soll = trigger.event.data.soll | default(none) %}
        {{ soll | float | round(1) if soll is number else this.state }}
      attributes:
        fenster_aus: >
          {% set aus = trigger.event.data.fenster_aus | default(none) %}
          {{ aus if aus in [true, false] else this.attributes.get('fenster_aus', false) }}

# Anzeige für die Klima-Karte. Das Ventil meldet im Modus Aus immer Soll 7°.
# Die Karte zeigt stattdessen sensor.leon_heizung_soll. Modus und Heizanzeige
# kommen vom Ventil, Eingaben gehen an Skript und Ventil.
- climate:
    - unique_id: leon_heizung_karte
      default_entity_id: climate.leon_heizung
      name: Leon Heizung
      icon: mdi:thermostat
      availability: "{{ states('climate.leon_thermostat') not in ['unknown', 'unavailable'] }}"
      optimistic: true
      temperature_unit: "°C"
      precision: 0.5
      min_temperature: 4
      max_temperature: 35
      target_temperature_step: 0.5
      hvac_modes: "{{ ['off', 'auto', 'heat'] }}"
      hvac_mode: >
        {% set mode = states('climate.leon_thermostat') %}
        {{ mode if mode in ['off', 'auto', 'heat'] else 'off' }}
      hvac_action: >
        {% set action = state_attr('climate.leon_thermostat', 'hvac_action') %}
        {{ action if action in ['cooling', 'defrosting', 'drying', 'fan', 'heating', 'idle', 'off', 'preheating'] else 'idle' }}
      current_temperature: >
        {% if states('sensor.leon_temperatur') | is_number %}
          {{ states('sensor.leon_temperatur') }}
        {% endif %}
      target_temperature: >
        {% if states('sensor.leon_heizung_soll') | is_number %}
          {{ states('sensor.leon_heizung_soll') }}
        {% endif %}
      set_temperature:
        - action: script.leon_heizung_soll
          data:
            temperatur: "{{ temperature }}"
      set_hvac_mode:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.leon_thermostat
          data:
            hvac_mode: "{{ hvac_mode }}"

