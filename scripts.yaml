multiroom_umschalten:
  alias: Multiroom umschalten
  description: Nimmt "dort" in die Gruppe von "hier" auf oder nimmt es heraus.
    Beim Koppeln führt die Gruppe, in der "hier" schon ist, sonst die Anlage, die
    gerade spielt, sonst "hier". Das Mitglied spielt dieselbe Quelle mit, auch Line
    In, Optical und ARC. Verlässt das Hauptgerät die Gruppe, führt die nächste
    Anlage den Rest.
  icon: mdi:speaker-multiple
  fields:
    hier:
      name: Hier
      required: true
      selector:
        entity:
          domain: media_player
          integration: linkplay
    dort:
      name: Dort
      required: true
      selector:
        entity:
          domain: media_player
          integration: linkplay
  sequence:
  - variables:
      g_hier: "{% from 'anlagen.jinja' import gruppe_von %}{{ gruppe_von(hier) | from_json }}"
      g_dort: "{% from 'anlagen.jinja' import gruppe_von %}{{ gruppe_von(dort) | from_json }}"
  - if:
    - condition: template
      value_template: '{{ dort in g_hier }}'
    then:
    - if:
      - condition: template
        value_template: '{{ dort == g_hier[0] }}'
      then:
      - variables:
          rest: "{{ g_hier | reject('equalto', dort) | list }}"
      - action: media_player.unjoin
        target:
          entity_id: '{{ rest }}'
      - if:
        - condition: template
          value_template: '{{ rest | count > 1 }}'
        then:
        - delay:
            seconds: 3
        - action: media_player.join
          target:
            entity_id: '{{ rest[0] }}'
          data:
            group_members: '{{ rest[1:] }}'
      else:
      - action: media_player.unjoin
        target:
          entity_id: '{{ dort }}'
    else:
    - variables:
        leiter: "{{ g_hier[0] if g_hier | count > 1 else (g_dort[0] if g_dort | count > 1 and
          not is_state(hier, 'playing') else (dort if is_state(dort, 'playing') and not is_state(hier,
          'playing') else hier)) }}"
        neu: "{% from 'anlagen.jinja' import gruppe_von %}{{ [hier, dort] | reject('in', gruppe_von(leiter) | from_json) | list }}"
    - action: media_player.join
      target:
        entity_id: '{{ leiter }}'
      data:
        group_members: '{{ neu }}'
  mode: single
multiroom_auswahl:
  alias: Multiroom Auswahl
  description: Wertet eine Option von select.multiroom_<anlage> aus und schaltet die
    gewählte Anlage über multiroom_umschalten um.
  icon: mdi:speaker-multiple
  fields:
    hier:
      name: Hier
      required: true
      selector:
        entity:
          domain: media_player
          integration: linkplay
    option:
      name: Option
      required: true
      selector:
        text: {}
  sequence:
  - variables:
      dort: "{% from 'anlagen.jinja' import anlage_zu_option %}{{ anlage_zu_option(option) }}"
  - condition: template
    value_template: '{{ dort != '''' and dort != hier }}'
  - action: script.multiroom_umschalten
    data:
      hier: '{{ hier }}'
      dort: '{{ dort }}'
  mode: queued
radio_player_umschalten:
  alias: Radio Player umschalten
  description: Nimmt eine Anlage in die Radio-Auswahl auf oder heraus. Läuft gerade
    ein Sender, steigt sie sofort ein oder hört auf. Hört das Hauptgerät auf,
    übernimmt die nächste Anlage der Gruppe den Sender.
  icon: mdi:speaker
  fields:
    player:
      name: Player
      required: true
      selector:
        entity:
          domain: media_player
          integration: linkplay
  sequence:
  - variables:
      auswahl: "{{ state_attr('sensor.radio_auswahl', 'player') or [] }}"
      war_an: '{{ player in auswahl }}'
      rl: "{{ state_attr('sensor.radio_sender', 'leiter') or '' }}"
      url: "{{ state_attr('sensor.radio_sender', 'url') or '' }}"
      laeuft: "{{ not is_state('sensor.radio_sender', 'Aus') and rl != '' and is_state(rl, 'playing')
        and url != '' }}"
      g: "{% from 'anlagen.jinja' import gruppe_von %}{{ gruppe_von(rl) | from_json if rl else [] }}"
  - event: radio
    event_data:
      umschalten: '{{ player }}'
  - condition: template
    value_template: '{{ laeuft }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not war_an and player not in g }}'
      sequence:
      - action: media_player.join
        target:
          entity_id: '{{ rl }}'
        data:
          group_members:
          - '{{ player }}'
    - conditions:
      - condition: template
        value_template: '{{ war_an and player != rl and player in g }}'
      sequence:
      - action: media_player.unjoin
        target:
          entity_id: '{{ player }}'
    - conditions:
      - condition: template
        value_template: '{{ war_an and player == rl }}'
      sequence:
      - variables:
          rest: "{{ g | reject('equalto', player) | list }}"
      - if:
        - condition: template
          value_template: '{{ rest | count > 0 }}'
        then:
        - action: media_player.unjoin
          target:
            entity_id: '{{ rest }}'
        - action: media_player.media_stop
          target:
            entity_id: '{{ player }}'
        - delay:
            seconds: 3
        - action: media_player.play_media
          target:
            entity_id: '{{ rest[0] }}'
          data:
            media_content_id: '{{ url }}'
            media_content_type: music
        - if:
          - condition: template
            value_template: '{{ rest | count > 1 }}'
          then:
          - delay:
              seconds: 3
          - action: media_player.join
            target:
              entity_id: '{{ rest[0] }}'
            data:
              group_members: '{{ rest[1:] }}'
        - event: radio
          event_data:
            leiter: '{{ rest[0] }}'
        else:
        - action: media_player.media_stop
          target:
            entity_id: '{{ player }}'
        - event: radio
          event_data:
            sender: Aus
  mode: queued
radio_abspielen:
  alias: Radio abspielen
  description: Spielt einen Sender auf allen Anlagen der Radio-Auswahl. Führt schon
    eine gewählte Anlage eine Gruppe, bleibt sie Hauptgerät, sonst eine, die gerade
    spielt, sonst die erste. Gewählte Anlagen kommen dazu, nicht gewählte verlassen
    die Gruppe.
  icon: mdi:radio
  fields:
    sender:
      name: Sender
      required: true
      selector:
        text: {}
    url:
      name: Stream-URL
      required: true
      selector:
        text: {}
  sequence:
  - variables:
      auswahl: "{{ state_attr('sensor.radio_auswahl', 'player') or [] }}"
  - condition: template
    value_template: '{{ auswahl | count > 0 }}'
  - variables:
      leiter: >-
        {% from 'anlagen.jinja' import gruppe_von %}
        {%- set ns = namespace(f=[], s=[]) -%}
        {%- for e in auswahl -%}
          {%- set g = gruppe_von(e) | from_json -%}
          {%- if g | count > 1 and g[0] == e %}{% set ns.f = ns.f + [e] %}{% endif -%}
          {%- if g[0] == e and is_state(e, 'playing') %}{% set ns.s = ns.s + [e] %}{% endif -%}
        {%- endfor -%}
        {{ (ns.f + ns.s + auswahl) | first }}
  - if:
    - condition: template
      value_template: "{% from 'anlagen.jinja' import gruppe_von %}{{ (gruppe_von(leiter) | from_json)[0] != leiter }}"
    then:
    - action: media_player.unjoin
      target:
        entity_id: '{{ leiter }}'
    - delay:
        seconds: 3
  - variables:
      raus: "{% from 'anlagen.jinja' import gruppe_von %}{{ gruppe_von(leiter) | from_json | reject('in', auswahl) | list }}"
  - if:
    - condition: template
      value_template: '{{ raus | count > 0 }}'
    then:
    - action: media_player.unjoin
      target:
        entity_id: '{{ raus }}'
    - delay:
        seconds: 2
  - variables:
      rein: "{% from 'anlagen.jinja' import gruppe_von %}{{ auswahl | reject('in', gruppe_von(leiter) | from_json) | list }}"
  - if:
    - condition: template
      value_template: '{{ rein | count > 0 }}'
    then:
    - action: media_player.join
      target:
        entity_id: '{{ leiter }}'
      data:
        group_members: '{{ rein }}'
    - delay:
        seconds: 3
  - action: media_player.play_media
    target:
      entity_id: '{{ leiter }}'
    data:
      media_content_id: '{{ url }}'
      media_content_type: music
  - event: radio
    event_data:
      sender: '{{ sender }}'
      url: '{{ url }}'
      leiter: '{{ leiter }}'
  mode: restart
radio_stopp:
  alias: Radio stoppen
  description: Stoppt das Hauptgerät des Senders mit seiner Gruppe und alle Anlagen
    der Radio-Auswahl.
  icon: mdi:stop
  sequence:
  - variables:
      rl: "{{ state_attr('sensor.radio_sender', 'leiter') or '' }}"
      ziel: "{% from 'anlagen.jinja' import gruppe_von %}{{ ((gruppe_von(rl) | from_json if rl else []) + (state_attr('sensor.radio_auswahl',
        'player') or [])) | unique | list }}"
  - condition: template
    value_template: '{{ ziel | count > 0 }}'
  - action: media_player.media_stop
    target:
      entity_id: '{{ ziel }}'
  - event: radio
    event_data:
      sender: Aus
  mode: restart
