
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor:
  - platform: time_date
    display_options:
      - 'date_time_iso'
      - 'time'
      - 'date'
      

# User-created Lovelace dashboards. YAML mode: the visual editor does not
# save these. Strategy dashboards (Übersicht, Karte) stay in storage mode.
lovelace:
  dashboards:
    dashboard-schlemnitz:
      mode: yaml
      filename: dashboards/dashboard-schlemnitz.yaml
      title: Schlemnitz
      icon: mdi:cards-heart
      show_in_sidebar: true
      require_admin: false
    dashboard-test:
      mode: yaml
      filename: dashboards/dashboard-test.yaml
      title: Test
      show_in_sidebar: true
      require_admin: false
    dashboard-zeitsteuerung:
      mode: yaml
      filename: dashboards/dashboard-zeitsteuerung.yaml
      title: Zeitsteuerung
      icon: mdi:calendar-clock
      show_in_sidebar: true
      require_admin: false
