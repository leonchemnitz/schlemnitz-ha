# YAML-Modus: Home Assistant lädt diese Datei.
# Der visuelle Editor speichert sie nicht. Nach Änderungen die Datei
# speichern; HA liest sie beim nächsten Abruf erneut.
views:
  - title: Schlemnitz
    sections:
      - type: grid
        cards:
          - type: heading
            heading_style: subtitle
          - type: iframe
            url: /local/wetter-moabit.html?v=2
            aspect_ratio: "300:250"
            allow_open_top_navigation: true
            hide_background: true
          - type: custom:bubble-card
            card_type: select
            sub_button:
              main: []
              bottom: []
            entity: input_select.tageszeit_modus
            show_attribute: false
            attribute: editable
            show_state: true
          - type: custom:bubble-card
            card_type: horizontal-buttons-stack
            1_link: '#ems'
            1_name: Ems
            1_entity: light.ems_lichter
            1_icon: mdi:bed-king
            2_link: '#wohnzimmer'
            2_name: Wohnzimmer
            2_icon: mdi:sofa
            3_link: '#leon'
            3_name: Leon
            3_icon: mdi:desk
            3_entity: light.leon_alle_lichter
            4_link: '#kueche'
            4_name: Küche
            4_icon: mdi:stove
            4_entity: light.kueche_lichter
            5_link: '#bad'
            5_name: Bad
            5_icon: mdi:bathtub
            5_entity: light.bad_alle_lichter_entitaten
            6_link: '#flur'
            6_name: Flur
            6_icon: mdi:hanger
            6_entity: light.flur_alle_lichter
            7_link: '#waschkueche'
            7_name: Waschküche
            7_icon: mdi:washing-machine
            7_entity: light.waschkueche_decke
            2_entity: light.wohnzimmer_lichter
          - type: custom:bubble-card
            card_type: pop-up
            name: Ems
            icon: mdi:bed-king
            hash: '#ems'
            entity: sensor.zhimi_mb5_c00e_temperature
            show_state: true
            button_type: slider
            tap_action:
              action: more-info
            styles: |
              .bubble-sub-button-2 {
                background-color: ${(() => {
                  const raw = hass.states['sensor.ems_rh_wand_kategorie'] && hass.states['sensor.ems_rh_wand_kategorie'].state;
                  if (raw === 'Sicher') return '#2e9d4b';
                  if (raw === 'Erhöht') return '#ef8b1a';
                  if (raw === 'Kritisch') return '#d32f2f';
                  return '#8b919a';
                })()} !important;
              }
            sub_button:
              main:
                - entity: sensor.zhimi_mb5_c00e_relative_humidity
                  show_state: true
                  show_icon: true
                  icon: mdi:water-percent
                - entity: sensor.ems_rh_wand
                  show_state: true
                  show_name: false
                  show_icon: true
                  icon: mdi:water-percent
                  tap_action:
                    action: navigate
                    navigation_path: /dashboard-schlemnitz/wandfeuchte
              bottom: []
            slider_fill_orientation: left
            slider_value_position: right
            title: Ems Popup
            grid_options:
              rows: auto
            cards:
              - type: custom:bubble-card
                card_type: climate
                name: Heizung
                sub_button:
                  main:
                    - entity: binary_sensor.ems_fenstersensor_contact
                      name: Fenster
                      icon: mdi:window-closed-variant
                      show_name: false
                      show_state: false
                      show_icon: true
                      show_background: true
                      state_background: true
                  bottom: []
                entity: climate.ems_heizung
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                sub_button:
                  main:
                    - entity: sensor.ems_pm25
                      show_state: true
                      show_icon: true
                      icon: mdi:air-filter
                  bottom: []
                styles: |
                  .bubble-sub-button-1 {
                    background-color: ${(() => {
                      const raw = hass.states['sensor.ems_pm25'] && hass.states['sensor.ems_pm25'].state;
                      const n = parseFloat(raw);
                      if (raw == null || raw === '' || raw === 'unavailable' || raw === 'unknown' || isNaN(n)) return '#8b919a';
                      if (n < 20) return '#2e9d4b';
                      if (n <= 120) return '#ef8b1a';
                      return '#d32f2f';
                    })()} !important;
                  }
                show_icon: true
                force_icon: false
                scrolling_effect: false
                name: Luftreiniger
                show_attribute: false
                attribute: environment.pm2_5_density
